<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>발주왕 · 재고 입력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12211c;--paper:#f6f4ec;--card:#fff;--green:#1f7a4d;--green-d:#155f3b;
    --line:#dcd8cb;--muted:#6b7169;--warn:#c23b2b;--warn-bg:#fbe9e6;
    --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -18px rgba(18,33,28,.45)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;padding-bottom:120px}
  .num{font-family:"Archivo","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#eef2ec;padding:12px 14px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-family:"Archivo";font-weight:800;font-size:19px;letter-spacing:-.5px}
  .brand span{font-size:12px;color:#9fb3a6}
  .ctrls{display:flex;gap:8px;margin-top:10px}
  select,.dateinput,.search{background:#1b2f28;color:#eef2ec;border:1px solid #2c463c;
    border-radius:11px;padding:10px 12px;font-size:15px;font-family:inherit}
  select,.dateinput{flex:1;min-width:0}
  .search{width:100%;margin-top:8px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  .chip{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:999px;
    background:#1b2f28;color:#cfe0d6;border:1px solid #2c463c;cursor:pointer}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .prog{font-size:12px;color:#9fb3a6;margin-top:8px}

  main{max-width:680px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
    margin-bottom:8px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
  .card.out{border-color:var(--warn);background:var(--warn-bg)}
  .card.filled{border-color:var(--green)}
  .name{font-weight:700;font-size:16px}
  .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#eef2ea;color:var(--green-d);padding:2px 7px;border-radius:999px}
  .qtywrap{display:flex;align-items:center;gap:6px}
  .qty{width:96px;text-align:right;border:1px solid var(--line);border-radius:11px;
    padding:11px;font-size:21px;font-weight:700;background:#fbfaf5}
  .qty:focus{outline:2px solid var(--green);border-color:var(--green)}
  .u{font-size:13px;color:var(--muted);min-width:26px}
  .out .qty{opacity:.4}
  .stockout{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .stockout input{width:19px;height:19px;accent-color:var(--warn)}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(180deg,rgba(246,244,236,0),var(--paper) 28%);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:680px;margin:0 auto;display:flex;gap:8px}
  .bar .inner.hidden{display:none}
  .btn{flex:1;border:none;border-radius:13px;padding:15px;font-family:"Archivo";font-weight:700;
    font-size:16px;background:var(--green);color:#fff;cursor:pointer;box-shadow:var(--shadow)}
  .btn:disabled{background:#9fb0a6}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:15px 18px}

  /* 결과 */
  .grp{margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center}
  .grp .sup{color:var(--ink);font-size:15px}
  .slip{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:12px;margin-bottom:8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px}
  .slip>div:first-child{flex:1 1 150px;min-width:130px}
  .slip>div:last-child{flex:0 0 auto;margin-left:auto}
  .slip .nm{font-weight:700}
  .slip .sub{font-size:12px;color:var(--muted)}
  .oqty{width:56px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px;
    font-size:18px;font-weight:800;background:#fbfaf5;color:var(--green-d);font-family:"Archivo"}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
  .badge.manual{background:var(--warn-bg);color:var(--warn)}
  .msg{text-align:center;color:var(--muted);padding:36px 16px}
  .toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40}
  .toast.show{opacity:1;bottom:140px}
  .toast.err{background:var(--warn)}
  .hidden{display:none}
  .link{color:#9fb3a6;font-size:13px;text-decoration:underline;cursor:pointer;margin-left:auto}
  .prev{font-size:12px;color:var(--muted);white-space:nowrap}
  .fab{position:fixed;right:14px;bottom:118px;z-index:25;width:52px;height:52px;border-radius:50%;
    border:none;background:var(--ink);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
  .modalbg{position:fixed;inset:0;background:rgba(18,33,28,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modalbg.hidden{display:none}
  .modal{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:17px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fbfaf5}
  .modal .row2{display:flex;gap:8px}
  .modal .row2>div{flex:1}
  .modal .acts{display:flex;gap:8px;margin-top:16px}
  .btn.sm{padding:12px;font-size:15px}
  .supbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
  .suplist button{display:block;width:100%;margin:6px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf5;font-size:15px;font-family:inherit;cursor:pointer;text-align:left}
  .step{width:40px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}

  /* ── 모바일 밀도 개선(입력 영역 넓히기) ── */
  header{padding:8px 12px}
  .brand{font-size:15px}
  .brand b{font-size:17px}
  .ctrls{margin-top:6px;align-items:center}
  select,.dateinput,.search{padding:9px 10px;font-size:14px}
  .chips{margin-top:5px}
  .prog{margin-top:5px}
  main{padding:10px 12px}
  .card{padding:9px 10px;margin-bottom:5px;gap:5px 10px}
  .name{font-size:15px}
  .meta{margin-top:1px}
  .qty{padding:10px;font-size:19px}          /* 여전히 큰 탭 타깃(≈44px) */
  .stockout{margin-top:2px}
  .bar{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .btn{padding:12px;font-size:15px;min-height:46px}
  .btn.ghost{padding:12px 14px}
</style>
</head>
<body>

if(!session)location.href="index.html";

<header>
  <div class="brand"><b>발주왕</b><span id="viewLabel">마감 재고 입력</span>
    <a href="index.html" style="color:#9fb3a6;font-size:13px;text-decoration:none;margin-left:auto;margin-right:10px">🏠 메인</a><span class="link" id="loadOrder" style="margin-left:0">오늘 발주 불러오기</span></div>
  <div class="ctrls">
    <select id="store" style="display:none"></select>
    <input class="dateinput" type="date" id="date" style="flex:0 0 128px">
    <input class="search" id="search" placeholder="🔍 검색" autocomplete="off" style="flex:1;margin:0">
  </div>
  <div id="inputterBar" style="font-size:13px;margin-top:6px;display:none">
    <span id="inputterLabel"></span>
    <span class="link" id="changeInputter" style="margin-left:6px"></span>
  </div>
  <div class="filterrow" style="display:flex;gap:6px;margin-top:6px">
    <button class="chip on" id="byPart" style="cursor:pointer">파트별</button>
    <button class="chip" id="bySup" style="cursor:pointer">발주처별</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="prog" id="prog"></div>
</header>

<main id="inputView"><div id="items" class="msg">불러오는 중…</div></main>
<main id="resultView" class="hidden"><div id="results"></div></main>
<main id="cartView" class="hidden"><div id="cart"></div></main>

<div class="bar">
  <div class="inner" id="barInput">
    <button class="btn ghost" id="expStock">공유</button>
    <button class="btn" id="tempBtn">재고 저장</button>
    <button class="btn ghost" id="calcBtn" style="font-size:13px;flex:0 0 auto;padding-left:12px;padding-right:12px">ℹ️ 발주는<br>관리자 확정</button>
  </div>
  <div class="inner hidden" id="barResult">

    <button class="btn" id="orderBtn">🛒 담기</button>
    <button class="btn ghost" id="cartBtn">🛒 보기</button>
  </div>
  <div class="inner hidden" id="barCart">
    <button class="btn ghost" id="editBtn">수정하기</button>

<button class="fab" id="fab" title="새 품목 등록">＋</button>

<div class="modalbg hidden" id="modalbg">
  <div class="modal">
    <h3>새 품목 등록</h3>
    <label>품명 *</label><input id="nItem" placeholder="예) 시메사바">
    <div class="row2">
      <div><label>파트</label><input id="nPart" list="partList" placeholder="선택 또는 입력"><datalist id="partList"></datalist></div>
      <div><label>보관</label><input id="nStorage" list="storList" placeholder="선택 또는 입력"><datalist id="storList"></datalist></div>
    </div>
    <div class="row2">
      <div><label>발주처</label><input id="nSup" placeholder="예) 명인푸드"></div>

<div class="modalbg hidden" id="supbg">
  <div class="modal">
    <h3>거래처 변경 (오늘 발주서만)</h3>
    <div class="suplist" id="supList"></div>
    <div class="acts"><button class="btn ghost sm" id="supCancel">닫기</button></div>
  </div>
</div>

<div class="modalbg hidden" id="histbg">
  <div class="modal">
    <h3 id="histTitle">재고 기록</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">잘못 입력한 날을 고치고 저장하세요. 수정 후 "발주 계산하기"를 다시 누르면 평균에 반영돼요.</div>
    <div id="histList"></div>
    <div class="acts"><button class="btn ghost sm" id="histClose">닫기</button></div>

<div class="modalbg hidden" id="inputterbg">
  <div class="modal">
    <h3>오늘 입력자 선택</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">재고를 입력하는 본인 이름을 골라주세요.</div>
    <div id="staffList" style="display:flex;flex-wrap:wrap"></div>
    <div class="acts"><button class="btn ghost sm" id="inputterCancel">나중에</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API="https://baljuking.onrender.com";
const $=s=>document.querySelector(s);
let items=[], filterPart="전체", lastResults=[], reviewIds=new Set();

function toast(t,err){const e=$("#toast");e.textContent=t;e.className="toast show"+(err?" err":"");
  clearTimeout(e._t);e._t=setTimeout(()=>e.className="toast",2400);}
function today(){return new Date().toISOString().slice(0,10);}
function draftKey(){return `draft:${$("#store").value}:${$("#date").value}`;}

/* ── 입력자(직원) 선택 — Phase3 조각2. store_staff 활성 직원 이름 탭 선택 ──
   staff_id는 직원이 실제 선택됐을 때만 저장에 실린다(미적용/미등록이면 기존 동작 유지). */
let myProfile=null, staffList=[], currentStaff=null, isAdmin=false, isMgrUp=false;
let storeLocs=[], expandedSet=new Set();   // 조각4: 매장 장소목록 / '장소 나누기' 펼친 품목ID
async function getProfile(){
  for(let i=0;i<20 && !window.sbAuth;i++) await new Promise(r=>setTimeout(r,250));
  if(!window.sbAuth) return null;
  const {data:{session}}=await window.sbAuth.auth.getSession();
  const uid=session?.user?.id; if(!uid) return null;
  try{ const r=await sbFetch(`/profiles?id=eq.${uid}&select=store_id,role,name`);
    if(r.ok){const a=await r.json(); return a[0]||null;} }catch(e){}
  return null;
}
async function bindStore(){                     // #store를 공용계정 profiles.store_id로 자동 바인딩
  myProfile=await getProfile();
  const role = myProfile && myProfile.role;      // role null → staff(최소권한)
  isAdmin = role==="admin";
  isMgrUp = isAdmin || role==="manager";
  if(myProfile && myProfile.store_id!=null){
    const opt=[...$("#store").options].find(o=>+o.value===+myProfile.store_id);
    if(opt) $("#store").value=myProfile.store_id;
  }
  if(!isAdmin) $("#fab").style.display="none";        // 새 품목 등록 = 관리자만
  if(!isMgrUp) $("#loadOrder").style.display="none";  // 오늘 발주 불러오기 = 매니저+관리자
}
async function loadStaff(){
  staffList=[];
  try{ const r=await sbFetch(`/store_staff?store_id=eq.${$("#store").value}&active=eq.true&select=staff_id,name&order=name`);
    if(r.ok) staffList=await r.json(); }catch(e){}   // 테이블 없음/실패 → 빈 목록 → 게이트 미표시
}
function inputterKey(){return `inputter:${$("#store").value}:${$("#date").value}`;}
function updateInputterBar(){
  const bar=$("#inputterBar");
  if(!staffList.length){bar.style.display="none";return;}
  bar.style.display="block";
  if(currentStaff){$("#inputterLabel").innerHTML=`입력자 <b>${currentStaff.name}</b>`;$("#changeInputter").textContent="변경";}
  else{$("#inputterLabel").textContent="입력자 미선택";$("#changeInputter").textContent="선택하기";}
}
async function loadStoreLocations(){
  storeLocs=[];
  try{ const r=await sbFetch(`/store_locations?store_id=eq.${$("#store").value}&active=eq.true&select=name&order=id`);
    if(r.ok) storeLocs=(await r.json()).map(x=>x.name); }catch(e){}
}
/* 품목별 '장소 나누기' 펼침 상태 기억(매장 단위, 날짜 무관 — 품목 특성) */
function expandedKey(){return `loc-expanded:${$("#store").value}`;}
function loadExpanded(){ try{expandedSet=new Set(JSON.parse(localStorage.getItem(expandedKey())||"[]"));}catch(e){expandedSet=new Set();} }
function saveExpanded(){ localStorage.setItem(expandedKey(), JSON.stringify([...expandedSet])); }
function updSum(c){ const b=c.querySelector(".lsum"); if(!b)return;
  let s=0; c.querySelectorAll(".lq").forEach(i=>{const v=parseFloat(i.value); if(!isNaN(v)) s+=v;});
  b.textContent=Math.round(s*100)/100; }
function cardVal(c){  // 표시/집계값: 펼침=장소 합, 접힘=단일칸
  if(expandedSet.has(+c.dataset.id)){
    let s=0,any=false; c.querySelectorAll(".lq").forEach(i=>{const v=parseFloat(i.value); if(!isNaN(v)){s+=v;any=true;}});
    return any?s:""; }
  return c.querySelector(".qty").value.trim(); }
function cardFilled(c){ return c.querySelector('.stockout input').checked || cardVal(c)!==""; }
function applyExpand(c,on){
  const q=c.querySelector(".qty"), u=c.querySelector(".qtywrap .u"),
        sp=c.querySelector(".locsplit"), b=c.querySelector(".expandBtn");
  if(q)q.style.display=on?"none":""; if(u)u.style.display=on?"none":"";
  if(sp)sp.style.display=on?"flex":"none"; if(b)b.textContent=on?"−":"＋"; }
function openInputterGate(){
  if(!staffList.length) return;
  $("#staffList").innerHTML=staffList.map(s=>
    `<button class="chip" data-id="${s.staff_id}" data-name="${s.name}" style="margin:4px;cursor:pointer">${s.name}</button>`).join("");
  $("#staffList").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    currentStaff={staff_id:+b.dataset.id,name:b.dataset.name};
    localStorage.setItem(inputterKey(),JSON.stringify(currentStaff));
    updateInputterBar(); $("#inputterbg").classList.add("hidden");
  });
  $("#inputterbg").classList.remove("hidden");
}
function loadInputter(popIfNone){
  currentStaff=null;
  try{const s=JSON.parse(localStorage.getItem(inputterKey())||"null"); if(s&&s.staff_id)currentStaff=s;}catch(e){}
  updateInputterBar();
  if(staffList.length && !currentStaff && popIfNone) openInputterGate();
}
$("#changeInputter").onclick=openInputterGate;
$("#inputterCancel").onclick=()=>$("#inputterbg").classList.add("hidden");
$("#inputterbg").onclick=e=>{if(e.target.id==="inputterbg")$("#inputterbg").classList.add("hidden");};

async function init(){
  $("#date").value=today();
  try{
    const [stores,its]=await Promise.all([
      fetch(API+"/stores").then(r=>r.json()),
      fetch(API+"/items").then(r=>r.json())]);
    $("#store").innerHTML=stores.map(s=>`<option value="${s.store_id}">${s.name}</option>`).join("");
    items=its;                                  // item_id 순 = 엑셀 순
    items.sort((a,b)=>(parseFloat(a.location)||9999)-(parseFloat(b.location)||9999));
    await bindStore();                          // #store를 공용계정 매장으로 바인딩(렌더 전)
    await loadStaff(); await loadStoreLocations(); loadExpanded();  // 장소칸 빌드에 필요 → 렌더 전
    buildChips(); renderItems();
    loadInputter(true);                         // 입력자 게이트
  }catch(e){ $("#items").innerHTML="서버에 연결하지 못했어요.<br>무료 서버는 첫 접속 시 최대 1분 걸려요. 잠시 뒤 새로고침 해주세요."; }
}

let chipMode="part";  // part | supplier
function chipVal(i){return chipMode==="part"?(i.part||"기타"):((i.supplier||"미지정").toUpperCase());}
function buildChips(){
  const ps=["전체",...[...new Set(items.map(chipVal))]];
  $("#chips").innerHTML=ps.map(p=>`<div class="chip${p==="전체"?" on":""}" data-p="${p}">${p}</div>`).join("");

let todayRepl={};  // item_id -> {id, packs}  (오늘자 stock_replacements)
async function loadReplacements(){
  todayRepl={};
  try{
    const r=await sbFetch(`/stock_replacements?store_id=eq.${$("#store").value}&opened_on=eq.${$("#date").value}&select=id,item_id,packs`);
    if(r.ok)(await r.json()).forEach(x=>{todayRepl[x.item_id]={id:x.id,packs:x.packs};});
  }catch(e){}

function refreshBulkBtns(){
  document.querySelectorAll(".bulkwrap").forEach(w=>{
    const id=+w.dataset.id, t=todayRepl[id], n=t?t.packs:0;
    w.innerHTML = n>0
      ? `<span style="font-size:13px;color:var(--green);font-weight:700">🛢 오늘 새 통 ${n}개 ✓</span>
         <button class="bulkPlus" style="border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer">+통</button>
         <button class="bulkMinus" style="border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer">−</button>`
      : `<button class="bulkPlus" style="border:1px solid var(--line);background:#fbfaf5;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--green);cursor:pointer">🛢 새 통 오픈</button>`;
    w.querySelector(".bulkPlus").onclick=()=>bulkOpen(id,false);
    const m=w.querySelector(".bulkMinus"); if(m)m.onclick=()=>bulkOpen(id,true);
  });
}
async function bulkOpen(id,dec){
  const cur=todayRepl[id];
  try{
    if(!cur){
      if(dec)return;
      const row={store_id:+$("#store").value,item_id:id,opened_on:$("#date").value,packs:1};
      if(currentStaff) row.staff_id=currentStaff.staff_id;
      const r=await sbFetch("/stock_replacements",
        {method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify([row])});
      if(r.ok){const x=(await r.json())[0];todayRepl[id]={id:x.id,packs:x.packs};toast("새 통 1개 기록 · 교체주기 반영");}
      else{toast("기록 실패",1);}
    }else{
      const np=cur.packs+(dec?-1:1);
      if(np<=0){
        await sbFetch(`/stock_replacements?id=eq.${cur.id}`,{method:"DELETE"});
        delete todayRepl[id]; toast("새 통 기록 취소");
      }else{
        await sbFetch(`/stock_replacements?id=eq.${cur.id}`,{method:"PATCH",body:JSON.stringify({packs:np})});
        todayRepl[id]={id:cur.id,packs:np}; toast(`오늘 새 통 ${np}개`);
      }
    }
  }catch(e){toast("기록 실패",1);}
  refreshBulkBtns();
}

/* 조각4: 장소별 병합·표시. (item,location)별 병합(개수형 최신/벌크 평균) → 장소 간 합.
   카드에 "이미: 보관 2(홍) · 해동 1(김) = 합 3" 표시(중복 방지). 입력칸엔 내(장소)입력만 프리필. */
async function loadShared(){
  try{
    const r=await sbFetch(`/stock_draft?store_id=eq.${$("#store").value}&date=eq.${$("#date").value}&select=item_id,qty,so,created_at,staff_id,location`);
    if(!r.ok)return;
    const rows=await r.json();
    const nameOf={}; staffList.forEach(s=>nameOf[s.staff_id]=s.name);
    const bulkOf={}; items.forEach(i=>bulkOf[i.item_id]=!!i.is_bulk);
    const NUL="__nul__";
    const byItem={};
    rows.forEach(x=>{const it=byItem[x.item_id]=byItem[x.item_id]||{}; const k=x.location||NUL; (it[k]=it[k]||[]).push(x);});
    Object.keys(byItem).forEach(id=>{
      const c=document.querySelector(`.card[data-id="${id}"]`); if(!c)return;
      const locs=byItem[id];
      let total=0, anyConflict=false, mySo=false; const parts=[]; const myByLoc={};
      const myId=currentStaff?currentStaff.staff_id:null;
      Object.keys(locs).forEach(k=>{
        const grp=locs[k], loc=(k===NUL)?null:k;
        const qs=grp.map(x=>x.qty).filter(q=>q!=null).map(Number);
        let val=null, lc=false;
        if(bulkOf[id]){ if(qs.length) val=Math.round(qs.reduce((a,b)=>a+b,0)/qs.length*100)/100; }
        else{
          const latest=grp.slice().sort((a,b)=>(a.created_at||"").localeCompare(b.created_at||"")).pop();
          val=latest.qty!=null?Number(latest.qty):null;
          if(qs.length>=2){const mx=Math.max(...qs),mn=Math.min(...qs),d=mx-mn; lc=d>=1&&(d/mx)>0.2;}
        }
        if(val!=null) total+=val;
        if(lc) anyConflict=true;
        const who=[...new Set(grp.map(x=>nameOf[x.staff_id]).filter(Boolean))].join(",");
        parts.push(`${loc||"미지정"} ${val==null?"-":val}${who?`(${who})`:""}${lc?" ⚠":""}`);
        const mine=grp.find(x=>(x.staff_id||null)===myId);
        if(mine){ if(mine.qty!=null) myByLoc[k]=Number(mine.qty); if(mine.so) mySo=true; }
      });
      const soEl=c.querySelector('.stockout input');
      if(expandedSet.has(+id)){                              // 펼침: 장소칸별 내 입력 프리필
        c.querySelectorAll(".lq").forEach(inp=>{const mv=myByLoc[inp.dataset.loc]; if(mv!=null) inp.value=mv;});
        updSum(c);
      }else{                                                 // 접힘: 단일칸에 내 미지정 입력 프리필
        const mv=myByLoc[NUL]; if(mv!=null) c.querySelector(".qty").value=mv;
      }
      if(mySo){soEl.checked=true;c.classList.add("out");}
      c.classList.toggle("filled",cardFilled(c));
      let lb=c.querySelector(".locbreak");
      if(!lb){lb=document.createElement("div");lb.className="locbreak";
        lb.style.cssText="font-size:12px;margin-top:3px";
        c.querySelector(".meta").insertAdjacentElement("afterend",lb);}
      const nLoc=Object.keys(locs).length;
      lb.innerHTML=`이미: ${parts.join(" · ")}${nLoc>1?` = <b>합 ${Math.round(total*100)/100}</b>`:""}`;
      lb.style.color=anyConflict?"var(--warn)":"var(--muted)";
    });
    updProg();
  }catch(e){}
}

let prevMap={};
// (조각e/D2-가) 직원 경로의 daily_stock 직접 write는 제거됨.
// 재고 확정은 관리자가 발주화면에서 /stock/confirm으로만 수행한다.
async function loadPrev(){
  prevMap={};
  try{
    const [Y,M,D]=$("#date").value.split("-").map(Number);
    const dd=new Date(Y,M-1,D-1);
    const y=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,"0")}-${String(dd.getDate()).padStart(2,"0")}`;
    // 가장 최근 재고일(전일 우선, 없으면 과거 최근) 찾기
    const rs=await sbFetch(`/daily_stock?store_id=eq.${$("#store").value}&date=lt.${$("#date").value}&order=date.desc&limit=1&select=date`);
    let baseDay=y;
    if(rs.ok){const a=await rs.json();if(a.length)baseDay=a[0].date;}
    // baseDay 다음날 ~ 오늘까지 입고 합산 (그 사이 들어온 물량 모두 반영)
    const [by,bm,bd]=baseDay.split("-").map(Number);
    const nx=new Date(by,bm-1,bd+1);
    const from=`${nx.getFullYear()}-${String(nx.getMonth()+1).padStart(2,"0")}-${String(nx.getDate()).padStart(2,"0")}`;
    const r2=await sbFetch(`/daily_inbound?store_id=eq.${$("#store").value}&date=gte.${from}&date=lte.${$("#date").value}&select=item_id,inbound_qty`);
    const inbMap={};
    if(r2.ok)(await r2.json()).forEach(x=>inbMap[x.item_id]=(inbMap[x.item_id]||0)+x.inbound_qty);
    const r=await sbFetch(`/daily_stock?store_id=eq.${$("#store").value}&date=eq.${baseDay}&select=*`);
    if(!r.ok)return;
    (await r.json()).forEach(row=>{
      const q=row.stock_qty??row.qty??row.closing_qty??row.closing_stock;
      if(q!=null)prevMap[row.item_id]=q;
    });
    // 정식 재고 없으면 전일 임시저장분으로 대체
    const r3=await sbFetch(`/stock_draft?store_id=eq.${$("#store").value}&date=eq.${y}&select=item_id,qty,so`);
    if(r3.ok)(await r3.json()).forEach(row=>{
      if(prevMap[row.item_id]==null)prevMap[row.item_id]=row.so?0:row.qty;
    });
    document.querySelectorAll("[data-prev]").forEach(el=>{
      const id=el.dataset.prev;
      const q=prevMap[id], ib=inbMap[id];
      if(q==null&&ib==null){el.textContent="";return;}
      const total=(q||0)+(ib||0);
      el.textContent=`전일 ${q??0}${ib?` +입고 ${ib}`:""}`;
      if(ib)prevMap[id]=total;
      const c=el.closest(".card"), qty=c.querySelector(".qty");
      const so=c.querySelector('input[type=checkbox]');
      if(qty.value.trim()===""&&!so.checked){qty.value=total;c.classList.add("filled");}
    });
    updProg();
  }catch(e){}
}

  document.querySelectorAll("#items .card").forEach(c=>{
    const id=+c.dataset.id, so=c.querySelector('.stockout input').checked;
    if(expandedSet.has(id)){

        out.push({item_id:id, qty:parseFloat(v)||0, so, location:inp.dataset.loc}); any=true;});
      if(!any && so) out.push({item_id:id, qty:0, so, location:null});

      if(v!=="" || so) out.push({item_id:id, qty:v===""?0:parseFloat(v), so, location:null});

  });
  return out;
}
function autosave(){
  const d={};
  document.querySelectorAll("#items .card").forEach(c=>{
    const id=c.dataset.id, so=c.querySelector('.stockout input').checked;

}

      return `<div class="slip" data-name="${r.item_name}" data-sup="${sup}">
        <div><div class="nm">${r.item_name}</div>
          <div class="sub">잔여 ${r.today_stock} ${r.stock_unit}${manual?" · 데이터 부족(직접 입력)":(r.avg_consumption!=null?(r.avg_weekday!==r.avg_weekend?` · 평일 ${r.avg_weekday}·주말 ${r.avg_weekend} × ${r.cover_days}일치`:` · 일평균 ${r.avg_consumption} × ${r.cover_days}일치`):"")}${rec}</div></div>
        <div style="display:flex;align-items:center;gap:6px">
          ${manual?'<span class="badge manual">수동</span>':""}${reviewIds.has(r.item_id)?'<span class="badge manual">검토</span>':""}
          <button class="supbtn" data-id="${r.item_id}">거래처↔</button>
          <button class="step" data-d="-1">−</button>
          <input class="oqty num" data-id="${r.item_id}" data-sup="${sup}" data-name="${r.item_name}"
            data-unit="${r.order_unit}" inputmode="decimal" value="${q}">
          <button class="step" data-d="1">＋</button>
          <span class="u">${r.order_unit}</span></div>
      </div>`;
    }).join("");
    return `<div class="grp" data-sup="${sup}"><span class="sup">📦 ${sup}</span><span>${rows.length}품목</span></div>${body}`;
  }).join("");

  // 거래처 탭
  filterSup="전체";
  const sups=["전체",...Object.keys(groups)];
  $("#chips").innerHTML=sups.map(s=>`<div class="chip${s==="전체"?" on":""}" data-s="${s}">${s}</div>`).join("");
  $("#chips").classList.remove("hidden");
  $("#chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    filterSup=c.dataset.s;
    $("#chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
    applyFilter();
  });

  // 서버에 저장된 오늘 발주 반영 → 그 위에 로컬 임시수정 반영
  fetch(`${API}/orders?store_id=${$("#store").value}&on=${$("#date").value}`)
    .then(r=>r.json()).then(rows=>{
      rows.forEach(o=>{const el=document.querySelector(`.oqty[data-id="${o.item_id}"]`);
        if(el)el.value=o.order_qty;});
      const od2=JSON.parse(localStorage.getItem(odKey())||"{}");
      document.querySelectorAll(".oqty").forEach(el=>{
        if(od2[el.dataset.id]!=null)el.value=od2[el.dataset.id];});
      
    }).catch(()=>{});

  // 저장된 발주수량 복원 + 자동 임시저장 + 0 전체선택
  const od=JSON.parse(localStorage.getItem(odKey())||"{}");
  document.querySelectorAll(".oqty").forEach(el=>{
    if(od[el.dataset.id]!=null)el.value=od[el.dataset.id];
    el.addEventListener("focus",()=>el.select());
    el.addEventListener("input",()=>{
      const d=JSON.parse(localStorage.getItem(odKey())||"{}");
      d[el.dataset.id]=el.value;localStorage.setItem(odKey(),JSON.stringify(d));
    });
  });
  // 거래처 변경(오늘만)
  document.querySelectorAll(".step").forEach(b=>b.onclick=()=>{
    const el=b.parentElement.querySelector(".oqty");
    el.value=Math.max(0,(parseFloat(el.value)||0)+ +b.dataset.d);
    el.dispatchEvent(new Event("input"));
  });
  document.querySelectorAll(".supbtn").forEach(b=>b.onclick=()=>{
    supTarget=+b.dataset.id;
    const sups=[...new Set([...items.map(i=>(i.supplier||"").toUpperCase()).filter(Boolean),"미지정"])];
    $("#supList").innerHTML=sups.map(s=>`<button data-s="${s}">${s}</button>`).join("");
    $("#supList").querySelectorAll("button").forEach(x=>x.onclick=()=>{
      const o=JSON.parse(localStorage.getItem(supKey())||"{}");
      o[supTarget]=x.dataset.s;localStorage.setItem(supKey(),JSON.stringify(o));
      $("#supbg").classList.add("hidden");
      showResults(lastResults);
      toast(`오늘 발주서에서 ${x.dataset.s}(으)로 옮겼어요`);
    });
    $("#supbg").classList.remove("hidden");
  });
  window.scrollTo(0,0);
}
function supKey(){return `osup:${$("#store").value}:${$("#date").value}`;}
let supTarget=null;
$("#supCancel").onclick=()=>$("#supbg").classList.add("hidden");
$("#supbg").onclick=e=>{if(e.target.id==="supbg")$("#supbg").classList.add("hidden");};
function odKey(){return `odraft:${$("#store").value}:${$("#date").value}`;}
let filterSup="전체";

$("#backBtn").onclick=()=>{
  $("#viewLabel").textContent="마감 재고 입력";
  $("#resultView").classList.add("hidden");$("#cartView").classList.add("hidden");
  $("#inputView").classList.remove("hidden");
  $("#barResult").classList.add("hidden");$("#barCart").classList.add("hidden");
  $("#barInput").classList.remove("hidden");
  $("#search").classList.remove("hidden");$("#chips").classList.remove("hidden");$("#prog").classList.remove("hidden");
  $("#search").value="";filterPart="전체";buildChips();applyFilter();
  $("#fab").classList.remove("hidden");

$("#orderBtn").onclick=async()=>{
  const btn=$("#orderBtn");btn.disabled=true;btn.textContent="담는 중…";
  const lines=[...document.querySelectorAll(".oqty")].map(el=>({
    item_id:+el.dataset.id, item_name:el.dataset.name, supplier:el.dataset.sup,
    order_qty:parseFloat(el.value)||0, order_unit:el.dataset.unit
  })).filter(l=>!isNaN(l.order_qty));
  try{
    const r=await fetch(API+"/orders/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({store_id:+$("#store").value,date:$("#date").value,lines})}).then(r=>r.json());
    toast(`🛒 ${r.saved}품목 담았어요`);
    localStorage.removeItem(odKey());
  }catch(e){toast("담기 실패",1);}
  finally{btn.disabled=false;btn.textContent="🛒 담기";}
};

// 장바구니 보기
$("#cartBtn").onclick=async()=>{
  try{
    const rows=(await fetch(`${API}/orders?store_id=${$("#store").value}&on=${$("#date").value}`).then(r=>r.json())).filter(r=>r.order_qty>0);
    if(!rows.length){toast("장바구니가 비었어요 — 먼저 담기를 눌러주세요",1);return;}
    const g={};
    rows.forEach(r=>(g[r.supplier||"미지정"]=g[r.supplier||"미지정"]||[]).push(r));
    $("#cart").innerHTML=Object.entries(g).map(([s,l])=>
      `<div class="grp"><span class="sup">📦 ${s}</span><span>${l.length}품목</span></div>`+
      l.map(r=>`<div class="slip"><div class="nm">${r.item_name}</div>
        <div style="font-weight:800;font-family:Archivo" class="num">${r.order_qty} <span class="u">${r.order_unit||""}</span></div></div>`).join("")
    ).join("");
    $("#viewLabel").textContent="발주 장바구니";
    $("#resultView").classList.add("hidden");$("#cartView").classList.remove("hidden");
    $("#barResult").classList.add("hidden");$("#barCart").classList.remove("hidden");
    $("#chips").classList.add("hidden");

  }catch(e){toast("불러오기 실패",1);}

  $("#viewLabel").textContent="발주 확인";
  $("#cartView").classList.add("hidden");$("#resultView").classList.remove("hidden");
  $("#barCart").classList.add("hidden");$("#barResult").classList.remove("hidden");

$("#confirmBtn").onclick=()=>toast("✅ 발주 확정! 공유 버튼으로 거래처에 전달하세요");

// 저장된 오늘 발주 불러와 수정
$("#loadOrder").onclick=async()=>{
  try{
    const rows=await fetch(`${API}/orders?store_id=${$("#store").value}&on=${$("#date").value}`).then(r=>r.json());
    if(!rows.length){toast("저장된 발주가 없어요");return;}
    lastResults=rows.map(r=>({item_id:r.item_id,item_name:r.item_name,supplier:r.supplier,
      order_qty:r.order_qty,order_unit:r.order_unit,today_stock:"-",stock_unit:"",status:"OK"}));

    toast("저장된 발주를 불러왔어요");

/* ── 새 품목 등록 ── */
$("#fab").onclick=()=>{
  const ps=[...new Set(items.map(i=>i.part||"기타"))];
  $("#partList").innerHTML=ps.map(p=>`<option value="${p}">`).join("");
  const ss=[...new Set(["냉장","냉동","기타",...items.map(i=>i.storage||i.zone).filter(Boolean)])];
  $("#storList").innerHTML=ss.map(s=>`<option value="${s}">`).join("");

$("#nCancel").onclick=()=>$("#modalbg").classList.add("hidden");
$("#modalbg").onclick=e=>{if(e.target.id==="modalbg")$("#modalbg").classList.add("hidden");};
$("#nSave").onclick=async()=>{
  const name=$("#nItem").value.trim();
  if(!name){toast("품명을 입력해주세요",1);return;}
  const btn=$("#nSave");btn.disabled=true;btn.textContent="등록 중…";
  let ok=false, lastErr="";
  try{
    const r=await fetch(API+"/items",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name, part:$("#nPart").value||null, supplier:$("#nSup").value.trim()||null,
        location:$("#nLoc").value.trim()||null, storage:$("#nStorage").value||null,
        stock_unit:$("#nSU").value.trim()||"ea",
        order_unit:$("#nOU").value.trim()||$("#nSU").value.trim()||"ea"})});
    ok=r.ok; if(!ok)lastErr=await r.text();
  }catch(e){lastErr=String(e);}
  btn.disabled=false;btn.textContent="등록";
  if(!ok){toast("등록 실패 — 잠시 뒤 다시",1);console.error(lastErr);return;}
  $("#modalbg").classList.add("hidden");
  ["nItem","nSup","nLoc","nSU","nOU"].forEach(id=>$("#"+id).value="");
  toast(`"${name}" 등록 완료`);
  try{
    autosave();
    items=await fetch(API+"/items").then(r=>r.json());
    items.sort((a,b)=>(parseFloat(a.location)||9999)-(parseFloat(b.location)||9999));
    buildChips(); renderItems();
  }catch(e){}
};

/* ── 엑셀(CSV) 내보내기 ── */
function dlCSV(name,rows){
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
$("#expStock").onclick=async()=>{
  const g={};
  document.querySelectorAll(".card").forEach(c=>{
    const v=(""+cardVal(c)).trim();               // 펼침이면 장소 합, 접힘이면 단일칸
    const so=c.querySelector('.stockout input').checked;
    if(v===""&&!so)return;
    const it=items.find(i=>i.item_id==c.dataset.id)||{};
    const line=`- ${it.name||c.dataset.name} ${so?"0(발주검토)":v+(it.stock_unit||"")}`;
    (g[it.part||"기타"]=g[it.part||"기타"]||[]).push(line);
  });
  if(!Object.keys(g).length){toast("입력된 재고가 없어요",1);return;}
  const txt=`[재고조사] ${$("#date").value}\n\n`+Object.entries(g)
    .map(([p,l])=>`■ ${p}\n${l.join("\n")}`).join("\n\n");
  if(navigator.share){try{await navigator.share({text:txt});return;}catch(e){}}
  await navigator.clipboard.writeText(txt);
  toast("재고 내용을 복사했어요 — 카톡 등에 붙여넣기");
};
$("#expOrder").onclick=async()=>{
  const els=[...document.querySelectorAll(".oqty")].filter(el=>parseFloat(el.value)>0);
  if(!els.length){toast("발주 수량이 없어요",1);return;}
  const g={};
  els.forEach(el=>(g[el.dataset.sup]=g[el.dataset.sup]||[]).push(`- ${el.dataset.name} ${el.value}${el.dataset.unit||""}`));
  const txt=`[발주] ${$("#date").value}\n\n`+Object.entries(g)
    .map(([s,l])=>`■ ${s}\n${l.join("\n")}`).join("\n\n");
  if(navigator.share){try{await navigator.share({text:txt});return;}catch(e){}}
  await navigator.clipboard.writeText(txt);
  toast("발주 내용을 복사했어요 — 카톡 등에 붙여넣기");
};

/* ── 품목별 재고 기록 조회·수정 ── */
async function openHist(id,name){
  $("#histTitle").textContent=`${name} · 최근 재고 기록`;
  $("#histList").innerHTML="불러오는 중…";
  $("#histbg").classList.remove("hidden");
  try{
    const r=await sbFetch(`/daily_stock?store_id=eq.${$("#store").value}&item_id=eq.${id}&order=date.desc&limit=14&select=date,stock_qty,is_carried,is_stockout`);
    const rows=r.ok?await r.json():[];
    if(!rows.length){$("#histList").innerHTML="<div style='color:var(--muted);padding:12px 0'>기록이 없어요</div>";return;}
    // 매니저+관리자만 편집(daily_stock PATCH). staff는 조회 전용.
    $("#histList").innerHTML=rows.map(x=>`
      <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="flex:1;font-size:14px">${x.date}${x.is_carried?' <span style="font-size:11px;color:var(--muted)">(자동)</span>':""}${x.is_stockout?' <span style="font-size:11px;color:var(--warn)">검토</span>':""}</span>
        ${isMgrUp
          ? `<input class="hq num" data-d="${x.date}" inputmode="decimal" value="${x.stock_qty}"
              style="width:70px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:8px">
             <button class="btn sm" style="flex:0;padding:8px 12px;font-size:13px" data-d="${x.date}">저장</button>`
          : `<span class="num" style="font-weight:700;min-width:70px;text-align:right">${x.stock_qty}</span>`}
      </div>`).join("");
    if(isMgrUp) $("#histList").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      const inp=$("#histList").querySelector(`.hq[data-d="${b.dataset.d}"]`);
      const v=parseFloat(inp.value);
      if(isNaN(v)){toast("숫자를 입력하세요",1);return;}
      b.disabled=true;
      const rr=await sbFetch(`/daily_stock?store_id=eq.${$("#store").value}&item_id=eq.${id}&date=eq.${b.dataset.d}`,
        {method:"PATCH",body:JSON.stringify({stock_qty:v,is_carried:false})});
      b.disabled=false;
      toast(rr.ok?`${b.dataset.d} 재고를 ${v}(으)로 수정했어요`:"수정 실패",rr.ok?0:1);
    });
  }catch(e){$("#histList").innerHTML="불러오기 실패";}
}
$("#histClose").onclick=()=>$("#histbg").classList.add("hidden");
$("#histbg").onclick=e=>{if(e.target.id==="histbg")$("#histbg").classList.add("hidden");};

init();
